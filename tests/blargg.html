<!doctype html>
<meta charset="utf-8">
<title>blargg test runner</title>
<script type="module">
import { NES } from '../src/nes.js';

const report = (s) => fetch('/__result?' + encodeURIComponent(s));
addEventListener('error', (e) => report(`ERROR ${e.message} @${e.filename}:${e.lineno}`));

const params = new URLSearchParams(location.search);
const rom = params.get('rom');
const maxFrames = +(params.get('frames') || 1500);
const nes = new NES();
nes.load(new Uint8Array(await fetch(`roms/${rom}`).then((r) => r.arrayBuffer())));
const m = nes.cart.mapper;

let result = 'TIMEOUT';
let started = false;
for (let f = 0; f < maxFrames; f++) {
  nes.frame();
  nes.apu.sampleCount = 0;
  const sig = m.prgRam[1] === 0xde && m.prgRam[2] === 0xb0 && m.prgRam[3] === 0x61;
  if (!sig) continue;
  const st = m.prgRam[0];
  if (st === 0x80) started = true;
  if (st !== 0x80 && (started || st !== 0)) {
    let text = '';
    for (let i = 4; m.prgRam[i]; i++) text += String.fromCharCode(m.prgRam[i]);
    result = `status=${st.toString(16)} frames=${f}\n${text}`;
    break;
  }
}
report(`${rom}: ${result}`);
</script>
