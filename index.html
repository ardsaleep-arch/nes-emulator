<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NES Emulator</title>
<style>
  :root { --bg: #14141a; --fg: #e8e8ee; --muted: #9a9aa8; --panel: #1e1e27; --accent: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .04em; }
  canvas { width: min(100%, 768px); aspect-ratio: 256 / 240; background: #000; image-rendering: pixelated;
           border: 4px solid var(--panel); border-radius: 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  button, label.btn { background: var(--panel); color: var(--fg); border: 1px solid #33334a; border-radius: 6px;
           padding: 8px 14px; font: inherit; cursor: pointer; }
  button:hover, label.btn:hover { border-color: var(--accent); }
  input[type=file] { display: none; }
  #status { color: var(--muted); min-height: 1.5em; }
  .keys { color: var(--muted); font-size: 13px; text-align: center; max-width: 560px; }
  kbd { background: var(--panel); border: 1px solid #33334a; border-radius: 4px; padding: 0 6px; }
</style>
</head>
<body>
<h1>NES EMULATOR</h1>
<canvas id="screen" width="256" height="240"></canvas>
<div class="bar">
  <label class="btn">เลือกไฟล์ ROM (.nes)<input id="rom" type="file" accept=".nes"></label>
  <button id="pause">หยุดชั่วคราว</button>
  <button id="reset">รีเซ็ต</button>
  <label>เสียง <input id="volume" type="range" min="0" max="100" value="100"></label>
</div>
<div id="status">ลากไฟล์ ROM มาวาง หรือกดปุ่มเลือกไฟล์</div>
<div class="keys">
  ลูกศร = ทิศทาง · <kbd>Z</kbd> = B · <kbd>X</kbd> = A · <kbd>Enter</kbd> = Start · <kbd>Shift</kbd> = Select · รองรับจอยเกมแพด
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
