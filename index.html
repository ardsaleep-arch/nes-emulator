<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NES Emulator</title>
<style>
  :root { --bg: #14141a; --fg: #e8e8ee; --muted: #9a9aa8; --panel: #1e1e27; --accent: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .04em; }
  canvas { width: min(100%, 768px); aspect-ratio: 256 / 240; background: #000; image-rendering: pixelated;
           border: 4px solid var(--panel); border-radius: 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  #stage { display: flex; justify-content: center; width: min(100%, 768px); }
  #stage canvas { width: 100%; }
  #stage:fullscreen { width: 100vw; height: 100vh; background: #000; align-items: center; }
  #stage:fullscreen canvas { width: auto; height: 100%; max-width: 100%; border: 0; border-radius: 0; }
  dialog { background: var(--panel); color: var(--fg); border: 1px solid #33334a; border-radius: 8px; padding: 20px; min-width: 300px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 12px; font-size: 17px; }
  #padrows { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 14px; align-items: center; margin-bottom: 14px; }
  #padrows button { text-align: left; min-width: 140px; }
  #padrows b { color: var(--muted); font-size: 13px; font-weight: 500; }
  #padrows button.wait { border-color: var(--accent); color: var(--accent); }
  #padinfo { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  .row.turbo { justify-content: flex-start; margin-bottom: 14px; }
  select { background: var(--bg); color: var(--fg); border: 1px solid #33334a; border-radius: 6px; padding: 4px 8px; font: inherit; }
  button, label.btn { background: var(--panel); color: var(--fg); border: 1px solid #33334a; border-radius: 6px;
           padding: 8px 14px; font: inherit; cursor: pointer; }
  button:hover, label.btn:hover { border-color: var(--accent); }
  input[type=file] { display: none; }
  #status { color: var(--muted); min-height: 1.5em; }
  .keys { color: var(--muted); font-size: 13px; text-align: center; max-width: 560px; }
  kbd { background: var(--panel); border: 1px solid #33334a; border-radius: 4px; padding: 0 6px; }
</style>
</head>
<body>
<h1>NES EMULATOR</h1>
<div id="stage"><canvas id="screen" width="256" height="240"></canvas></div>
<div class="bar">
  <label class="btn">เลือกไฟล์ ROM (.nes)<input id="rom" type="file" accept=".nes"></label>
  <button id="pause">หยุดชั่วคราว</button>
  <button id="reset">รีเซ็ต</button>
  <button id="fullscreen">เต็มจอ (F)</button>
  <button id="padcfg">ตั้งค่าปุ่ม</button>
  <label>เสียง <input id="volume" type="range" min="0" max="100" value="100"></label>
</div>
<div id="status">ลากไฟล์ ROM มาวาง หรือกดปุ่มเลือกไฟล์</div>
<div class="keys">
  ค่าเริ่มต้น: ลูกศร = ทิศทาง · <kbd>Z</kbd> = B · <kbd>X</kbd> = A · <kbd>Enter</kbd> = Start · <kbd>Shift</kbd> = Select · <kbd>S</kbd> / <kbd>A</kbd> = Turbo A / B · <kbd>F</kbd> = เต็มจอ · รองรับจอยเกมแพด · ตั้งปุ่มเองได้
</div>
<dialog id="paddlg">
  <h2>ตั้งค่าปุ่มควบคุม</h2>
  <div id="padinfo"></div>
  <div id="padrows"></div>
  <div class="row turbo"><label>ความเร็ว Turbo <select id="turbo"></select></label></div>
  <div class="row"><button id="padreset">ค่าเริ่มต้น</button><button id="padclose">ปิด</button></div>
</dialog>
<script type="module" src="src/main.js"></script>
</body>
</html>
